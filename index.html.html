main{max-width:520px;margin:0 auto;padding:64px 22px 56px;display:flex;flex-direction:column;align-items:center;animation:entrada .9s ease both}
@keyframes entrada{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.avatar{width:112px;height:112px;border-radius:50%;background:#000;overflow:hidden;border:2px solid var(--gold);box-shadow:0 0 0 6px rgba(217,187,116,.16),0 14px 40px rgba(0,0,0,.55)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
h1{margin:22px 0 10px;font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-size:38px;font-weight:600;letter-spacing:.6px;line-height:1.1;text-align:center;color:var(--cream);text-shadow:0 2px 14px rgba(0,0,0,.6)}
.bio{margin:0 0 24px;max-width:380px;text-align:center;font-size:14px;line-height:1.7;font-weight:400;color:var(--cream-soft);text-shadow:0 1px 8px rgba(0,0,0,.6)}
.bio::after{content:"";display:block;width:56px;height:1px;background:var(--gold);margin:24px auto 0}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:0 0 34px}
.tag{display:inline-flex;align-items:center;gap:9px;padding:9px 18px;border:1px solid var(--gold-soft);border-radius:999px;background:rgba(217,187,116,.12);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--gold);font-size:13.5px;font-weight:600;letter-spacing:.2px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(217,187,116,.8)}
.links{width:100%;display:flex;flex-direction:column;gap:16px}
.link{display:flex;align-items:center;min-height:78px;padding:10px 14px;background:rgba(12,12,12,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--gold-soft);border-radius:18px;color:var(--cream);text-decoration:none;font-weight:500;font-size:14.5px;line-height:1.45;letter-spacing:.2px;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,.4);transition:transform .2s ease,border-color .2s ease,background .2s ease}
.link:hover{transform:translateY(-2px);border-color:var(--gold);background:rgba(12,12,12,.72)}
.link:active{transform:translateY(0)}
.link:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.icon{flex:0 0 52px;width:52px;height:52px;border-radius:13px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
.icon svg{width:30px;height:30px;fill:var(--cream)}
.label{flex:1;padding:0 52px 0 12px}
.titulo{display:block}
.rodape{margin-top:44px;font-size:13px;font-weight:500;letter-spacing:.3px;color:rgba(246,239,224,.65);text-align:center;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.sub{display:block;margin-top:2px;font-size:12.5px;font-weight:400;color:var(--cream-soft)}
@media (prefers-reduced-motion: reduce){main{animation:none}.link{transition:none}}
</style>
</head>

document.getElementById('nome').textContent = PERFIL.nome;
const bio = document.getElementById('bio');
PERFIL.bio.split('\n').forEach((linha, i) => {
  if (i) bio.appendChild(document.createElement('br'));
  bio.appendChild(document.createTextNode(linha));
});

const TAGS = ["Construindo uma jornada no digital"];
const tagsEl = document.getElementById('tags');
TAGS.forEach(t => {
  const s = document.createElement('span');
  s.className = 'tag';
  s.textContent = t;
  tagsEl.appendChild(s);
});

const nav = document.getElementById('links');
LINKS.forEach(l => {
  const a = document.createElement('a');
  a.className = 'link';
  a.href = l.url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  const ic = document.createElement('span');
  ic.className = 'icon';
  ic.innerHTML = ICONES[l.icone] || ICONES.link;
  const tx = document.createElement('span');
  tx.className = 'label';
  const t1 = document.createElement('span');
  t1.className = 'titulo';
  t1.textContent = l.rotulo;
  tx.appendChild(t1);
  if (l.sub) {
    const t2 = document.createElement('span');
    t2.className = 'sub';
    t2.textContent = l.sub;
    tx.appendChild(t2);
  }
  a.append(ic, tx);
  nav.appendChild(a);
});
</script>
